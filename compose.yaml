services:
  web:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    env_file: .env.local
    environment:
      REPOCARE_DB_PATH: /app/data/repocare.sqlite
      REPOCARE_REQUIRE_LOGIN: 'true'
    volumes: ["repocare-data:/app/data"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
  worker:
    build: .
    command: ["npm", "run", "worker"]
    restart: unless-stopped
    env_file: .env.local
    environment:
      REPOCARE_DB_PATH: /app/data/repocare.sqlite
    volumes: ["repocare-data:/app/data"]
  agent-worker:
    build: .
    command: ["npm", "run", "agent-worker"]
    restart: unless-stopped
    env_file: .env.local
    environment:
      REPOCARE_DB_PATH: /app/data/repocare.sqlite
    volumes: ["repocare-data:/app/data"]
volumes:
  repocare-data:
